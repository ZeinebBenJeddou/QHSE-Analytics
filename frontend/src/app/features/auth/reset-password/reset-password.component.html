<div class="reset-page">
  <mat-card class="reset-card">
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <span class="brand-name">QHSE Analytics</span>
    </div>

    <h1 class="card-title">Réinitialiser le mot de passe</h1>
    <p class="card-sub">Choisissez un nouveau mot de passe pour votre compte.</p>

    <p class="field-error" *ngIf="fieldErrors.token">{{ fieldErrors.token }}</p>

    <label class="field-label">Nouveau mot de passe</label>
    <mat-form-field appearance="outline" class="reset-field">
      <mat-icon matPrefix>lock_outline</mat-icon>
      <input matInput [type]="hidePassword ? 'password' : 'text'" placeholder="••••••••••" [(ngModel)]="data.password">
      <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <p class="field-error" *ngIf="fieldErrors.password">{{ fieldErrors.password }}</p>

    <label class="field-label">Confirmer le mot de passe</label>
    <mat-form-field appearance="outline" class="reset-field">
      <mat-icon matPrefix>verified_user</mat-icon>
      <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" placeholder="••••••••••" [(ngModel)]="data.confirmPassword">
      <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <p class="field-error" *ngIf="fieldErrors.confirmPassword">{{ fieldErrors.confirmPassword }}</p>

    <p class="form-error" *ngIf="formError">{{ formError }}</p>
    <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>

    <button mat-flat-button class="btn-submit" type="button" [disabled]="isSubmitting" (click)="submit()">
      {{ isSubmitting ? 'Réinitialisation...' : 'Valider' }}
      <mat-icon>arrow_forward</mat-icon>
    </button>

    <p class="login-link-line">
      Retour à <a routerLink="/login">la connexion</a>
    </p>
  </mat-card>
</div>
