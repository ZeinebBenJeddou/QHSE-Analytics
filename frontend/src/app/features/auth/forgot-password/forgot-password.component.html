<div class="forgot-page">
  <mat-card class="forgot-card">
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>mark_email_unread</mat-icon>
      </div>
      <span class="brand-name">QHSE Analytics</span>
    </div>

    <h1 class="card-title">Mot de passe oublié</h1>
    <p class="card-sub">Entrez votre email pour recevoir un lien de réinitialisation.</p>

    <label class="field-label">Adresse email</label>
    <mat-form-field appearance="outline" class="forgot-field">
      <mat-icon matPrefix>mail_outline</mat-icon>
      <input matInput type="email" placeholder="vous@entreprise.com" [(ngModel)]="email">
    </mat-form-field>
    <p class="field-error" *ngIf="fieldError">{{ fieldError }}</p>

    <p class="form-error" *ngIf="formError">{{ formError }}</p>
    <p class="form-success" *ngIf="successMessage">{{ successMessage }}</p>

    <button mat-flat-button class="btn-submit" type="button" [disabled]="isSubmitting" (click)="submit()">
      {{ isSubmitting ? 'Envoi...' : 'Envoyer le lien' }}
      <mat-icon>send</mat-icon>
    </button>

    <p class="login-link-line">
      Retour à <a routerLink="/login">la connexion</a>
    </p>
  </mat-card>
</div>
