<div class="auth-shell">
  <div class="mesh-bg"></div>
  <div class="grain"></div>

  <div class="auth-panel">

    <div class="brand">
      <span class="brand-text">QHSE <strong>Analytics</strong></span>
    </div>

    <div class="panel-header">
      <h1 class="panel-title">Mot de passe oublié</h1>
      <p class="panel-sub">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="submit()" class="auth-form" novalidate>

      <div class="field" [class.field--error]="email?.invalid && email?.touched">
        <label class="field-label">Adresse email</label>
        <div class="input-wrap">
          <span class="input-prefix">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input
            class="field-input"
            type="email"
            formControlName="email"
            placeholder="Adresse email"
            autocomplete="email"
          />
        </div>
        <span class="field-hint field-hint--error" *ngIf="email?.hasError('required') && email?.touched">
          Email requis
        </span>
        <span class="field-hint field-hint--error" *ngIf="email?.hasError('email') && email?.touched">
          Adresse email invalide
        </span>
      </div>

      <div class="alert alert--error" *ngIf="backendError">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ backendError }}
      </div>

      <div class="alert alert--success" *ngIf="successMessage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        {{ successMessage }}
      </div>

      <button class="btn-primary" type="submit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        Envoyer le lien
      </button>

    </form>

    <div class="nav-links">
      <a routerLink="/auth/login" class="nav-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Retour à la connexion
      </a>
      <a routerLink="/auth/register" class="nav-link">Créer un compte</a>
    </div>

    

  </div>
</div>
