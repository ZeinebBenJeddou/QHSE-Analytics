<div class="auth-shell">
  <div class="mesh-bg"></div>
  <div class="grain"></div>

  <div class="auth-panel">

  
    <div class="brand">
      
      <span class="brand-text">QHSE <strong>Analytics</strong></span>
    </div>

    <ng-container *ngIf="view === 'login'">

      <div class="panel-header">
        <h1 class="panel-title">Bienvenue</h1>
        <p class="panel-sub">Connectez-vous à votre espace </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>

        <div class="field" [class.field--error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <label class="field-label">Adresse email</label>
          <div class="input-wrap">
            <span class="input-prefix">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input
              class="field-input"
              type="email"
              formControlName="email"
              placeholder="Adresse email"
              autocomplete="email"
            />
          </div>
          <span class="field-hint field-hint--error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Veuillez saisir un email valide
          </span>
        </div>

        
        <div class="field" [class.field--error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <div class="field-label-row">
            <label class="field-label">Mot de passe</label>
            <a routerLink="/auth/forgot-password" class="text-btn">Mot de passe oublié ?</a>
          </div>
          <div class="input-wrap">
            <span class="input-prefix">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
            </span>
            <input
              class="field-input"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="eye-toggle" (click)="showPassword = !showPassword" [title]="showPassword ? 'Masquer' : 'Afficher'">
              <svg *ngIf="!showPassword" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="field-hint field-hint--error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Mot de passe requis (6 caractères minimum)
          </span>
        </div>

        
        <button class="btn-primary" type="submit" [disabled]="!loginForm.valid || isLoading">
          <span class="btn-spinner" *ngIf="isLoading">
            <mat-spinner diameter="16"></mat-spinner>
          </span>
          <ng-container *ngIf="!isLoading">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Se connecter
          </ng-container>
          <span *ngIf="isLoading">Connexion en cours…</span>
        </button>

      </form>

      <p class="panel-footer">
        Pas encore de compte ?
        <a routerLink="/auth/register" class="footer-link">Créer un compte</a>
      </p>

      <div class="secure-badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Connexion sécurisée 
      </div>

    </ng-container>

   
    
  </div>
</div>
