<div class="auth-shell">
  <div class="mesh-bg"></div>
  <div class="grain"></div>

  <div class="auth-panel">

    <div class="brand">
      <span class="brand-text">QHSE <strong>Analytics</strong></span>
    </div>

    <div class="panel-header">
      <h1 class="panel-title">Créer un compte</h1>
      <p class="panel-sub">Rejoignez votre espace </p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submit()" class="auth-form" novalidate>

      <div class="field-row">
        <div class="field" [class.field--error]="nom?.invalid && nom?.touched">
          <label class="field-label">Nom</label>
          <div class="input-wrap">
            <span class="input-prefix">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input class="field-input" type="text" formControlName="nom" placeholder="Nom" autocomplete="family-name"/>
          </div>
          <span class="field-hint field-hint--error" *ngIf="nom?.invalid && nom?.touched">Nom requis</span>
        </div>

        <div class="field" [class.field--error]="prenom?.invalid && prenom?.touched">
          <label class="field-label">Prénom</label>
          <div class="input-wrap">
            <span class="input-prefix">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input class="field-input" type="text" formControlName="prenom" placeholder="Prénom" autocomplete="given-name"/>
          </div>
          <span class="field-hint field-hint--error" *ngIf="prenom?.invalid && prenom?.touched">Prénom requis</span>
        </div>
      </div>

      <div class="field" [class.field--error]="email?.invalid && email?.touched">
        <label class="field-label">Adresse email</label>
        <div class="input-wrap">
          <span class="input-prefix">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input class="field-input" type="email" formControlName="email" placeholder="Adresse email" autocomplete="email"/>
        </div>
        <span class="field-hint field-hint--error" *ngIf="email?.hasError('required') && email?.touched">Email requis</span>
        <span class="field-hint field-hint--error" *ngIf="email?.hasError('email') && email?.touched">Adresse email invalide</span>
      </div>

      <div class="field" [class.field--error]="password?.invalid && password?.touched">
        <label class="field-label">Mot de passe</label>
        <div class="input-wrap">
          <span class="input-prefix">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input
            class="field-input"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button type="button" class="eye-toggle" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-hint field-hint--error" *ngIf="password?.hasError('required') && password?.touched">Mot de passe requis</span>
        <span class="field-hint field-hint--error" *ngIf="password?.hasError('minlength') && password?.touched">6 caractères minimum</span>
      </div>

      <div class="field" [class.field--error]="(confirmPassword?.invalid && confirmPassword?.touched) || (passwordsMismatch && confirmPassword?.touched)">
        <label class="field-label">Confirmer le mot de passe</label>
        <div class="input-wrap">
          <span class="input-prefix">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input
            class="field-input"
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button type="button" class="eye-toggle" (click)="showConfirm = !showConfirm">
            <svg *ngIf="!showConfirm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-hint field-hint--error" *ngIf="confirmPassword?.hasError('required') && confirmPassword?.touched">Confirmation requise</span>
        <span class="field-hint field-hint--error" *ngIf="passwordsMismatch && confirmPassword?.touched">Les mots de passe ne correspondent pas</span>
      </div>

      <div class="alert alert--error" *ngIf="backendError">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ backendError }}
      </div>

      <div class="alert alert--success" *ngIf="successMessage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        {{ successMessage }}
      </div>

      <button class="btn-primary" type="submit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Créer mon compte
      </button>

    </form>

    <p class="panel-footer">
      Déjà un compte ?
      <a routerLink="/auth/login" class="footer-link">Se connecter</a>
    </p>

    
  </div>
</div>
