<div class="auth-shell">
  <div class="mesh-bg"></div>
  <div class="grain"></div>

  <div class="auth-panel">

    <div class="brand">
      <span class="brand-text">QHSE <strong>Analytics</strong></span>
    </div>

    <div class="panel-header">
      <h1 class="panel-title">Nouveau mot de passe</h1>
      <p class="panel-sub">Choisissez un mot de passe sécurisé pour votre compte.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" class="auth-form" novalidate>

     
      <div class="field" [class.field--error]="password?.invalid && password?.touched">
        <label class="field-label">Nouveau mot de passe</label>
        <div class="input-wrap">
          <span class="input-prefix">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input
            class="field-input"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button type="button" class="eye-toggle" (click)="showPassword = !showPassword">
            <svg *ngIf="!showPassword" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-hint field-hint--error" *ngIf="password?.hasError('required') && password?.touched">
          Mot de passe requis
        </span>
        <span class="field-hint field-hint--error" *ngIf="password?.hasError('minlength') && password?.touched">
          8 caractères minimum
        </span>
      </div>

     
      <div class="field" [class.field--error]="(confirmPassword?.invalid && confirmPassword?.touched) || (resetForm.hasError('passwordsMismatch') && confirmPassword?.touched)">
        <label class="field-label">Confirmer le mot de passe</label>
        <div class="input-wrap">
          <span class="input-prefix">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </span>
          <input
            class="field-input"
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button type="button" class="eye-toggle" (click)="showConfirm = !showConfirm">
            <svg *ngIf="!showConfirm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showConfirm" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-hint field-hint--error" *ngIf="confirmPassword?.hasError('required') && confirmPassword?.touched">
          Confirmation requise
        </span>
        <span class="field-hint field-hint--error" *ngIf="resetForm.hasError('passwordsMismatch') && confirmPassword?.touched">
          Les mots de passe ne correspondent pas
        </span>
      </div>

      
      <div class="alert alert--error" *ngIf="backendError">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ backendError }}
      </div>

      <div class="alert alert--success" *ngIf="successMessage">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        {{ successMessage }}
      </div>

      <button class="btn-primary" type="submit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        Modifier le mot de passe
      </button>

    </form>

    <div class="nav-links">
      <a routerLink="/auth/login" class="nav-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Retour à la connexion
      </a>
    </div>

  </div>
</div>
