<div class="verify-page">
  <mat-card class="verify-card">
    <div class="brand">
      <div class="brand-icon" [class.success]="status === 'success'" [class.error]="status === 'error'">
        <mat-icon *ngIf="status === 'loading'">hourglass_top</mat-icon>
        <mat-icon *ngIf="status === 'success'">verified</mat-icon>
        <mat-icon *ngIf="status === 'error'">error</mat-icon>
      </div>
      <span class="brand-name">QHSE Analytics</span>
    </div>

    <h1 class="card-title" *ngIf="status !== 'error'">Vérification du compte</h1>
    <h1 class="card-title" *ngIf="status === 'error'">Vérification impossible</h1>
    <p class="card-sub">{{ message }}</p>

    <div class="actions" *ngIf="status === 'success'">
      <a mat-flat-button class="btn-primary" routerLink="/login">Aller à la connexion</a>
    </div>

    <div class="actions" *ngIf="status === 'error'">
      <a mat-flat-button class="btn-primary" routerLink="/login">Retour à la connexion</a>
    </div>
  </mat-card>
</div>
