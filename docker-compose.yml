services:

  #PostgreSQL
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qhse_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - qhse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d qhse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #Backend
  backend:
    build:
      context: ./QHSEAnalytics
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Base de données
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qhse_db
      # Mail
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
      # Groq 
      GROQ_API_KEYS: ${GROQ_API_KEYS}
      # Frontend URL
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8081:8080"
    volumes:
      - backend_storage:/app/storage/imports
      - backend_logs:/app/logs
    networks:
      - qhse_network
    healthcheck:
      test: ["CMD-SHELL",
             "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  #Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - qhse_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

#Volumes
volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  backend_logs:
    driver: local

#Réseau interne 
networks:
  qhse_network:
    driver: bridge
