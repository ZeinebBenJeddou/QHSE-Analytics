name: CI — QHSE Analytics

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────
  backend-test:
    name: Backend — Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qhse_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d qhse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        working-directory: QHSEAnalytics
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qhse_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_pass
          JWT_SECRET: ci-test-secret-do-not-use-in-production-32chars
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: test
          GROQ_API_KEY: test-key
          ADMIN_EMAIL: admin@test.com
          ADMIN_DEFAULT_PASSWORD: Test1234@
          APP_FRONTEND_URL: http://localhost:4200
        run: mvn test -Dspring.jpa.hibernate.ddl-auto=create-drop --no-transfer-progress

      - name: Build JAR (sans tests)
        working-directory: QHSEAnalytics
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: QHSEAnalytics/target/*.jar
          retention-days: 7

  # ── Frontend ──────────────────────────────────────────────
  frontend-test:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production
        working-directory: frontend
        run: npx ng build --configuration production

  # ── Docker Build (main seulement) ─────────────────────────
  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./QHSEAnalytics
          push: false
          tags: qhse-analytics-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: qhse-analytics-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
