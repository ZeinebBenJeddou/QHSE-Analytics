spring.application.name=QHSEAnalytics

server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_USERNAME}

# JWT

app.jwt.secret=${JWT_SECRET}

# 30 min
app.jwt.access-token-expiration=1800000

# 1h
app.jwt.refresh-token-expiration=3600000

# 7 jours
app.jwt.refresh-token-remember-expiration=604800000


# OTP
app.otp.expiration-minutes=10

# Verification email
app.email-token.expiration-hours=24
app.email-token.resend-cooldown-minutes=2

# Reset password
app.password-reset.expiration-hours=1

# Admin par default
app.admin.email=${MAIL_USERNAME}
app.admin.password=${ADMIN_DEFAULT_PASSWORD}
app.admin.nom=Super
app.admin.prenom=Admin

# URL Frontend
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# CORS
app.cors.allowed-origins=${APP_FRONTEND_URL:http://localhost:4200}

# Groq
app.groq.api-key=${GROQ_API_KEY}
app.groq.model=llama3-8b-8192
app.groq.timeout=30

# Actuator - Health check pour Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=8080