# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ADMINEMAIL}
spring.mail.password=${APPPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${ADMINEMAIL}

# JWT
app.jwt.secret=${JWTKEY}
app.jwt.access-token-expiration=1800000
app.jwt.refresh-token-expiration=3600000
app.jwt.refresh-token-remember-expiration=604800000

# OTP
app.otp.expiration-minutes=10

# Verification email
app.email-token.expiration-hours=24
app.email-token.resend-cooldown-minutes=2

# Reset password
app.password-reset.expiration-hours=1

# Admin par default
app.admin.email=${ADMINEMAIL}
app.admin.password=${ADMINPASS}
app.admin.nom=Super
app.admin.prenom=Admin

# URL Frontend
app.frontend.url=http://localhost:4200

# CORS
app.cors.allowed-origins=http://localhost:4200

# Groq
app.groq.api-keys=${GROQKEYS}
app.groq.models=llama-3.3-70b-versatile,meta-llama/llama-4-scout-17b-16e-instruct,qwen/qwen3-32b
app.groq.timeout=30

# Gemini
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.0-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/

# Import automatique KPI
app.import.matching.fuzzy-threshold=0.85
app.import.matching.review-threshold=0.85
app.import.validator.taux-max=100.0
app.import.retention.raw-days=15
app.import.retention.preview-days=15
app.import.retention.purge-cron=0 30 2 * * *

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.QHSEAnalytics=INFO
logging.level.com.QHSEAnalytics.service.LlmProviderChain=DEBUG
logging.level.com.QHSEAnalytics.service.processing.AnalysisAgent=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/qhse-analytics.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Upload fichiers
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Rate limiting (tentatives max par fenetre de temps)
app.rate-limit.auth.max-attempts=5
app.rate-limit.auth.window-seconds=300

# Cache TTL
cache.kpiAnalysis.ttl.hours=24
