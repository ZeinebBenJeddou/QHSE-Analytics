spring.application.name=QHSEAnalytics

## PostgreSQL
spring.datasource.url=${DATAURL}
spring.datasource.username=${DATAUSERNAME}
spring.datasource.password=${DATAPASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# Flyway — schéma géré par migrations versionnées (V1 init schema, V2 indexes, V3 pgvector)
# baseline-on-migrate gère les BDs existantes créées avant l'activation de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0



