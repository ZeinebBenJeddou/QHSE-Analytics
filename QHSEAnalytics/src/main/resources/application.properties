spring.application.name=QHSEAnalytics

## PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0



# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_USERNAME}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=1800000
app.jwt.refresh-token-expiration=3600000
app.jwt.refresh-token-remember-expiration=604800000

# OTP
app.otp.expiration-minutes=10

# Verification email
app.email-token.expiration-hours=24
app.email-token.resend-cooldown-minutes=2

# Reset password
app.password-reset.expiration-hours=1

# Admin par default
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_DEFAULT_PASSWORD}
app.admin.nom=Super
app.admin.prenom=Admin

# URL Frontend
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# Groq
app.groq.api-keys=${GROQ_API_KEYS}
app.groq.models=llama-3.3-70b-versatile,meta-llama/llama-4-scout-17b-16e-instruct
app.groq.timeout=30

# Gemini
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-2.0-flash
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/
app.gemini.embedding-model=text-embedding-004

# Import automatique KPI
app.import.matching.fuzzy-threshold=0.85
app.import.matching.review-threshold=0.85
app.import.validator.taux-max=100.0
app.import.retention.raw-days=15
app.import.retention.preview-days=15
app.import.retention.purge-cron=0 30 2 * * *

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.QHSEAnalytics=INFO
logging.level.com.QHSEAnalytics.service.LlmProviderChain=DEBUG
logging.level.com.QHSEAnalytics.service.processing.AnalysisAgent=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/qhse-analytics.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# Import Quality
import.quality.score.valid=100
import.quality.score.warning=70
import.quality.score.invalid=0
import.quality.max.issues.per.severity=200

# Cleaning
import.cleaning.outlier.threshold.percent=500.0
import.cleaning.score.base=100
import.cleaning.score.penalty.invalid=50
import.cleaning.score.penalty.error=30
import.cleaning.score.penalty.warning=10
import.cleaning.score.penalty.info=5

# Extraction
import.extraction.confidence.threshold=0.4
import.extraction.mapping.good.threshold=0.70

# Validation
import.validation.year.min=1900
import.validation.year.max=2100

# Upload fichiers
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# File storage
qhse.storage.local.base-dir=./storage/imports

# Rate limiting
app.rate-limit.auth.max-attempts=5
app.rate-limit.auth.window-seconds=300

app.rate-limit.trust-proxy=false

# Cache TTL
cache.kpiAnalysis.ttl.hours=24

# RAG vector search
app.rag.embedding.threshold=0.72
app.rag.embedding.top-k=3
app.rag.embedding.fallback-threshold=0.50

# LLM temperature
app.analysis.batch-size=5
app.groq.temperature.json=0.1
app.groq.temperature.text=0.5

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
