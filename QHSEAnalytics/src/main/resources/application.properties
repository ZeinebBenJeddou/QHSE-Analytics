spring.application.name=QHSEAnalytics

## PostgreSQL
spring.datasource.url=${DATAURL}
spring.datasource.username=${DATAUSERNAME}
spring.datasource.password=${DATAPASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Flyway (desactive en dev — les migrations sont gérées par Hibernate ddl-auto)
# Passer à true + spring.jpa.hibernate.ddl-auto=validate en production
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration



